<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Prediction Platform | AI Engine</title>
    <!-- Bootstrap 5 Dark/Blue Coder Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light">

    <div class="container py-5">
        <!-- Header Section -->
        <div class="row mb-4">
            <div class="col-lg-12 text-center">
                <div class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 mb-2 px-3 py-2 rounded-pill font-monospace">
                    <i class="fas fa-terminal me-2"></i>AI SYSTEM v2.6 // SECURE INFERENCE TERMINAL
                </div>
                <h1 class="display-5 fw-bold text-gradient">Credit Risk Assessment Engine</h1>
                <p class="text-muted">Enter borrower attributes below to run real-time machine learning evaluation.</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Form Card -->
            <div class="col-lg-8 mx-auto">
                <div class="card bg-card border-secondary shadow-lg rounded-4 p-4">
                    <form action="/predict" method="POST" id="predictionForm">
                        <div class="row g-3">
                            
                            <!-- Personal Info -->
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Person Age</label>
                                <input type="number" step="1" class="form-control bg-dark text-light border-secondary" name="person_age" required placeholder="e.g., 28">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Annual Income ($)</label>
                                <input type="number" step="100" class="form-control bg-dark text-light border-secondary" name="person_income" required placeholder="e.g., 55000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Employment Length (yrs)</label>
                                <input type="number" step="0.5" class="form-control bg-dark text-light border-secondary" name="person_emp_length" required placeholder="e.g., 3.5">
                            </div>

                            <!-- Ownership & Loan Details -->
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Home Ownership</label>
                                <select class="form-select bg-dark text-light border-secondary" name="person_home_ownership" required>
                                    <option value="RENT">RENT</option>
                                    <option value="MORTGAGE">MORTGAGE</option>
                                    <option value="OWN">OWN</option>
                                    <option value="OTHER">OTHER</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Loan Intent</label>
                                <select class="form-select bg-dark text-light border-secondary" name="loan_intent" required>
                                    <option value="PERSONAL">PERSONAL</option>
                                    <option value="EDUCATION">EDUCATION</option>
                                    <option value="MEDICAL">MEDICAL</option>
                                    <option value="VENTURE">VENTURE</option>
                                    <option value="HOMEIMPROVEMENT">HOMEIMPROVEMENT</option>
                                    <option value="DEBTCONSOLIDATION">DEBTCONSOLIDATION</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Loan Grade</label>
                                <select class="form-select bg-dark text-light border-secondary" name="loan_grade" required>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="G">G</option>
                                </select>
                            </div>

                            <!-- Financial Numbers -->
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Loan Amount ($)</label>
                                <input type="number" step="100" class="form-control bg-dark text-light border-secondary" name="loan_amnt" required placeholder="e.g., 10000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Interest Rate (%)</label>
                                <input type="number" step="0.01" class="form-control bg-dark text-light border-secondary" name="loan_int_rate" required placeholder="e.g., 11.5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-monospace small text-primary">Percent Income</label>
                                <input type="number" step="0.01" class="form-control bg-dark text-light border-secondary" name="loan_percent_income" required placeholder="e.g., 0.18">
                            </div>

                            <!-- Credit History -->
                            <div class="col-md-6">
                                <label class="form-label font-monospace small text-primary">Default on File</label>
                                <select class="form-select bg-dark text-light border-secondary" name="cb_person_default_on_file" required>
                                    <option value="N">N (No)</option>
                                    <option value="Y">Y (Yes)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-monospace small text-primary">Credit History Length (yrs)</label>
                                <input type="number" step="1" class="form-control bg-dark text-light border-secondary" name="cb_person_cred_hist_length" required placeholder="e.g., 4">
                            </div>

                            <!-- Submit Button -->
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold font-monospace shadow-sm" id="submitBtn">
                                    <i class="fas fa-microchip me-2"></i>EXECUTE RISK ASSESSMENT PIPELINE
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Results Box (Conditional Server Output) -->
                    {% if prediction_text %}
                    <div class="mt-4 p-4 rounded-3 border border-primary bg-dark text-center shadow-inner animate-fade-in">
                        <h4 class="font-monospace text-info mb-2"><i class="fas fa-terminal me-2"></i>Execution Output</h4>
                        <p class="fs-4 fw-bold mb-1 {% if 'High Risk' in prediction_text %}text-danger{% else %}text-success{% endif %}">
                            {{ prediction_text }}
                        </p>
                        {% if probability %}
                        <p class="font-monospace text-muted mb-0">{{ probability }}</p>
                        {% endif %}
                    </div>
                    {% endif %}

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
